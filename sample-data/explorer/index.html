<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field catalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">FlytBase sample data</p>
        <a class="title" href="#/wells">Field catalog</a>
        <p class="tagline" id="tagline">Oil wells, inspections, maintenance, and compliance records</p>
      </div>
      <form class="search" role="search" id="search-form">
        <label class="sr-only" for="q">Search the catalog</label>
        <input id="q" name="q" type="search" placeholder="Search wells, people, spills, maintenance, notes…" autocomplete="off" disabled>
      </form>
      <nav class="nav" id="nav" aria-label="Catalog sections"></nav>
    </header>
    <div class="stats" id="stats" hidden></div>
    <main class="view" id="view">
      <p class="loading">Loading the catalog…</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
