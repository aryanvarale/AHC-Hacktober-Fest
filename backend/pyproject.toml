[project]
name = "aicopilot"
version = "0.1.0"
description = "Asset Intelligence Copilot: lite-mode data layer, query tools, and operator UI."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.0",
]

[project.scripts]
aicopilot = "aicopilot.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
